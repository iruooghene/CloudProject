version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: cloudproject-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_DB: cloudproject_db
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

    healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres" ]
        interval: 10s
        retries: 5
        start_period: 10s

  app:
    build: .
#    container_name: cloud-project
    environment:
      SPRING.DATASOURCE.URL: jdbc:postgresql://postgres:5432/cloudproject_db
      SPRING.DATASOURCE.USERNAME: admin
      SPRING.DATASOURCE.PASSWORD: your_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network


    ports:
      - "8088"
    deploy:
      replicas: 1
#      resources:
#        limits:
#         memory: 121M
      restart_policy:
        condition: on-failure
    healthcheck:
     test: [ "CMD", "curl", "-f", "http://localhost:8088/fibonacci/15" ]
     interval: 30s
     timeout: 10s
     retries: 3

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  # Mount the configuration file
    ports:
      - "9090:9090"  # Expose Prometheus UI
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'  # Point to the config file
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:


